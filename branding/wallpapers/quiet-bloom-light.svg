<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 1920 1080"><title>Quiet Bloom / MertensiaOS</title><desc>Warm canvas and a large cropped bloom. The clearest connection to the brand.</desc><defs><mask id="hole"><rect width="100" height="100" fill="white"/><circle cx="50" cy="50" r="8" fill="black"/></mask><g id="bloom"><g mask="url(#hole)"><ellipse cx="50" cy="30" rx="16" ry="23" transform="rotate(0 50 50)"/><ellipse cx="50" cy="30" rx="16" ry="23" transform="rotate(72 50 50)"/><ellipse cx="50" cy="30" rx="16" ry="23" transform="rotate(144 50 50)"/><ellipse cx="50" cy="30" rx="16" ry="23" transform="rotate(216 50 50)"/><ellipse cx="50" cy="30" rx="16" ry="23" transform="rotate(288 50 50)"/></g></g><linearGradient id="petal" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0.0000" stop-color="#E7DDF7"/><stop offset="0.5000" stop-color="#B69ADA"/><stop offset="1.0000" stop-color="#6941B5"/></linearGradient></defs><rect width="1920" height="1080" fill="#F8F5EF"/><g transform="translate(1060 255) scale(11.6)" fill="url(#petal)" opacity="1"><g mask="url(#hole)"><ellipse cx="50" cy="30" rx="16" ry="23" transform="rotate(0 50 50)"/><ellipse cx="50" cy="30" rx="16" ry="23" transform="rotate(72 50 50)"/><ellipse cx="50" cy="30" rx="16" ry="23" transform="rotate(144 50 50)"/><ellipse cx="50" cy="30" rx="16" ry="23" transform="rotate(216 50 50)"/><ellipse cx="50" cy="30" rx="16" ry="23" transform="rotate(288 50 50)"/></g></g><circle cx="1775" cy="844" r="40" fill="#F8F5EF" opacity=".08"/></svg>