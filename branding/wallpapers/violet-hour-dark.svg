<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 1920 1080"><title>Violet Hour / MertensiaOS</title><desc>Diffuse purple light, with no visible mark or hard edges. A quiet daily-use option.</desc><defs><mask id="hole"><rect width="100" height="100" fill="white"/><circle cx="50" cy="50" r="8" fill="black"/></mask><g id="bloom"><g mask="url(#hole)"><ellipse cx="50" cy="30" rx="16" ry="23" transform="rotate(0 50 50)"/><ellipse cx="50" cy="30" rx="16" ry="23" transform="rotate(72 50 50)"/><ellipse cx="50" cy="30" rx="16" ry="23" transform="rotate(144 50 50)"/><ellipse cx="50" cy="30" rx="16" ry="23" transform="rotate(216 50 50)"/><ellipse cx="50" cy="30" rx="16" ry="23" transform="rotate(288 50 50)"/></g></g><filter id="soft" x="-70%" y="-100%" width="240%" height="300%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="145"/></filter></defs><rect width="1920" height="1080" fill="#1D1429"/><g filter="url(#soft)"><ellipse cx="1530" cy="975" rx="950" ry="460" fill="#6941B5"/><ellipse cx="950" cy="1170" rx="920" ry="250" fill="#BBA0E0"/><ellipse cx="1550" cy="630" rx="290" ry="150" fill="#9766CA"/><ellipse cx="-40" cy="890" rx="490" ry="130" fill="#49365E"/></g></svg>