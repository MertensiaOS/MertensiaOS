# Installed only in the disposable installer and first-boot accounts' homes.
# Set the mode on the command line: gnome-session can reset the environment,
# and GNOME Shell's system unit can explicitly select its default mode.
[Service]
# These settings belong only to the disposable account, never the new user.
ExecStartPre=/usr/bin/gsettings set org.gnome.desktop.lockdown disable-lock-screen true
ExecStartPre=/usr/bin/gsettings set org.gnome.desktop.screensaver lock-enabled false
ExecStart=
ExecStart=/usr/bin/gnome-shell --mode=mertensia-setup
