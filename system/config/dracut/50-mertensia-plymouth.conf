# Also apply to future initramfs rebuilds; all assets come from the image.
add_dracutmodules+=" plymouth "
# The default populate helper includes only FreeType, which ignores Font's
# family. Pango honors Figtree and handles shaping/localized recovery prompts.
install_items+=" /usr/lib64/plymouth/label-pango.so /etc/fonts/fonts.conf /usr/share/fonts/mertensia/Figtree-Variable.ttf "
# Pango's graphical console requests "monospace", independently of Font.
# fonts.conf alone has no alias for it and can select proportional Noto Sans.
# Include the packaged alias and both weights used by systemd's boot messages.
install_items+=" /etc/fonts/conf.d/57-google-noto-sans-mono.conf /usr/share/fonts/google-noto/NotoSansMono-Regular.ttf /usr/share/fonts/google-noto/NotoSansMono-Bold.ttf "
