# Also apply to future initramfs rebuilds; all assets come from the image.
add_dracutmodules+=" plymouth "
# The default populate helper includes only FreeType, which ignores Font's
# family. Pango honors Figtree and handles shaping/localized recovery prompts.
install_items+=" /usr/lib64/plymouth/label-pango.so /etc/fonts/fonts.conf /usr/share/fonts/mertensia/Figtree-Variable.ttf "
