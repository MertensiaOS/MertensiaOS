[Unit]
Description=Stage signed MertensiaOS updates for the next user restart
After=network-online.target greenboot-healthcheck.service mertensia-boot-health-status.service
Wants=network-online.target
ConditionPathExists=!/usr/bin/mertensia-installer
ConditionVirtualization=!container

[Service]
ExecStart=
ExecStart=/usr/bin/mertensia-update stage
TimeoutStartSec=65min
