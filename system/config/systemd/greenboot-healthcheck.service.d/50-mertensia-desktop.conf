[Unit]
ConditionPathExists=/run/ostree-booted
ConditionPathExists=!/usr/bin/mertensia-installer
ConditionVirtualization=!container
Wants=gdm.service systemd-homed.service accounts-daemon.service mertensia-login-users.service

[Service]
TimeoutStartSec=150s

[Install]
WantedBy=
WantedBy=graphical.target
