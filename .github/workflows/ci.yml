name: Check source and build payload
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install test dependencies
        run: dnf -y install python3 python3-gobject python3-cairo librsvg2 python3-dbus python3-pyyaml python3-rpm gjs gtk4 libadwaita openssl libxcrypt bash systemd iso-codes xkeyboard-config kbd tzdata gcc pam-devel pkgconf-pkg-config gtk4-devel libadwaita-devel
      - run: python3 scripts/check-source.py
      - run: python3 tests/run_tests.py
        env:
          PYTHONDONTWRITEBYTECODE: '1'
  payload:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install container tools
        run: sudo apt-get update && sudo apt-get install -y podman skopeo
      - name: Build and lint production payload
        run: |
          sudo python3 scripts/build-inputs.py build payload localhost/mertensiaos:ci-unpacked
          sudo python3 scripts/build-inputs.py build installer localhost/mertensiaos:ci-installer --parent localhost/mertensiaos:ci-unpacked
          sudo bash scripts/rechunk-image.sh localhost/mertensiaos:ci-unpacked localhost/mertensiaos:ci
      - name: Capture native Plymouth splash and recovery prompts
        run: sudo bash scripts/test-plymouth.sh localhost/mertensiaos:ci "$RUNNER_TEMP/plymouth-preview"
      - name: Collect Plymouth captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plymouth-native-preview
          path: ${{ runner.temp }}/plymouth-preview
          if-no-files-found: warn
      - name: Verify native Flatpak update permission handling
        run: sudo bash scripts/test-flatpak-updates.sh localhost/mertensiaos:ci
      - name: Verify oo7 password changes preserve saved secrets
        run: sudo bash scripts/test-keyring.sh localhost/mertensiaos:ci
