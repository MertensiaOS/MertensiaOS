name: Publish signed release
on:
  push:
    branches: [main]
    paths: [build-inputs/lock.json]
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional immutable version override (leave blank to generate)'
        required: false
        type: string
      promote_digest:
        description: 'Promote this passing testing sha256 digest to latest after Brave acceptance'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: mertensia-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && !inputs.promote_digest
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve release version
        id: version
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          version="$VERSION_OVERRIDE"
          if [[ -z "$version" ]]; then
            unset VERSION_ID
            source system/config/identity/os-release
            version="${VERSION_ID:?Missing OS VERSION_ID}.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER:?}.${GITHUB_RUN_ATTEMPT:?}"
          fi
          if [[ ! "$version" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ || "$version" == latest || "$version" == testing ]]; then
            echo "Expected a valid container tag other than latest or testing" >&2
            exit 2
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'Release version: %s\n' "$version"
      - name: Install build and test tools
        run: sudo apt-get update && sudo apt-get install -y podman skopeo qemu-system-x86 qemu-utils ovmf swtpm xorriso python3
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
          install-dir: /usr/local/bin
          use-sudo: 'true'
      - name: Resolve and verify the upgrade baseline
        id: baseline
        run: python3 scripts/release-channel.py baseline >> "$GITHUB_OUTPUT"
      - name: Build clean release payload
        env:
          BASELINE: ${{ steps.baseline.outputs.channel }}@${{ steps.baseline.outputs.digest }}
        run: |
          sudo python3 scripts/build-inputs.py build payload localhost/mertensiaos:release-unpacked \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.mertensiaos.release-order=$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" \
            --label "org.mertensiaos.upgrade-baseline=$BASELINE"
      - name: Rechunk and validate release payload
        run: sudo bash scripts/rechunk-image.sh localhost/mertensiaos:release-unpacked localhost/mertensiaos:release
      # Main push CI runs independently while the runner prepares the local payload.
      - name: Wait for successful source and payload CI for the release commit
        timeout-minutes: 185
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$((SECONDS + 180 * 60))
          while (( SECONDS < deadline )); do
            run=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f branch=main -f event=push -f "head_sha=$GITHUB_SHA" \
              --jq '.workflow_runs | max_by(.run_number) | if . == null then "missing" else "\(.status)/\(.conclusion // "none") \(.html_url)" end')
            read -r result url <<< "$run"
            case "$result" in
              completed/success)
                echo "ci.yml passed for $GITHUB_SHA: $url"
                exit 0 ;;
              completed/*)
                echo "::error::ci.yml failed for $GITHUB_SHA: $result${url:+ $url}. Resolve the failure and retry."
                exit 1 ;;
              *) echo "Waiting for ci.yml for $GITHUB_SHA: $result${url:+ $url}" ;;
            esac
            sleep 60
          done
          echo "::error::Timed out waiting for source and payload CI for $GITHUB_SHA after 180 minutes."
          exit 1
      - name: Authenticate registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          sudo install -d -m 0700 /root/.docker
          printf '%s' "$GHCR_TOKEN" | sudo podman login --authfile /root/.docker/config.json ghcr.io --username "$GHCR_USER" --password-stdin
      - name: Publish separate signed update and recovery fixtures
        id: fixture
        env:
          REGISTRY_AUTH_FILE: /root/.docker/config.json
        run: |
          fixture_repo=ghcr.io/mertensiaos/mertensiaos-integration
          for mode in none always transient; do
            fixture_tag="run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$mode"
            sudo podman build --build-arg BASE_IMAGE=localhost/mertensiaos:release \
              --build-arg INTEGRATION_ROLE=payload --build-arg "INTEGRATION_REVISION=$fixture_tag" \
              --build-arg "INTEGRATION_HEALTH_MODE=$mode" \
              --build-arg "INTEGRATION_UPGRADE_IMAGE=$fixture_repo:$fixture_tag" \
              -f tests/integration/Containerfile -t "localhost/mertensiaos:fixture-$mode" .
            sudo env "REGISTRY_AUTH_FILE=$REGISTRY_AUTH_FILE" podman push --digestfile "$RUNNER_TEMP/fixture-digest" \
              "localhost/mertensiaos:fixture-$mode" "docker://$fixture_repo:$fixture_tag"
            fixture_digest="$(cat "$RUNNER_TEMP/fixture-digest")"
            [[ "$fixture_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            fixture_image="$fixture_repo@$fixture_digest"
            sudo --preserve-env=ACTIONS_ID_TOKEN_REQUEST_TOKEN,ACTIONS_ID_TOKEN_REQUEST_URL,GITHUB_ACTIONS cosign sign --yes \
              --new-bundle-format=false --use-signing-config=false "$fixture_image"
            bash scripts/verify-release.sh --fixture "$fixture_image"
            printf '%s=%s\n' "$mode" "$fixture_image" >> "$GITHUB_OUTPUT"
            if [[ "$mode" = none ]]; then
              printf 'automatic=%s:%s\n' "$fixture_repo" "$fixture_tag" >> "$GITHUB_OUTPUT"
            fi
          done
      - name: Gate release on installation, signed upgrade and automatic recovery
        env:
          UPGRADE_IMAGE: ${{ steps.fixture.outputs.none }}
          AUTOMATIC_UPDATE_IMAGE: ${{ steps.fixture.outputs.automatic }}
          FAILURE_IMAGE: ${{ steps.fixture.outputs.always }}
          TRANSIENT_IMAGE: ${{ steps.fixture.outputs.transient }}
        run: |
          sudo bash scripts/test-iso.sh --build --base-image localhost/mertensiaos:release \
            --upgrade-image "$UPGRADE_IMAGE" --require-upgrade \
            --automatic-update-image "$AUTOMATIC_UPDATE_IMAGE" \
            --greenboot-failure-image "$FAILURE_IMAGE" --greenboot-transient-image "$TRANSIENT_IMAGE" \
            --require-greenboot-recovery \
            --work-dir "$RUNNER_TEMP/mertensia-release-test" --junit "$RUNNER_TEMP/mertensia-release-test/junit.xml"
      - name: Publish and verify immutable signed candidate
        id: publish
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          REGISTRY_AUTH_FILE: /root/.docker/config.json
        run: sudo --preserve-env=ACTIONS_ID_TOKEN_REQUEST_TOKEN,ACTIONS_ID_TOKEN_REQUEST_URL,GITHUB_ACTIONS,GITHUB_WORKFLOW_REF,GITHUB_OUTPUT,REGISTRY_AUTH_FILE bash scripts/publish-image.sh localhost/mertensiaos:release "$RELEASE_VERSION"
      - name: Gate on exact signed baseline to candidate upgrade and rollback
        env:
          CANDIDATE: ${{ steps.publish.outputs.image }}
          BASELINE: ${{ steps.baseline.outputs.digest }}
        run: |
          sudo bash scripts/test-iso.sh --build --base-image localhost/mertensiaos:release \
            --upgrade-image "$CANDIDATE" --require-upgrade \
            --production-upgrade-from "ghcr.io/mertensiaos/mertensiaos@$BASELINE" \
            --work-dir "$RUNNER_TEMP/mertensia-channel-test" --junit "$RUNNER_TEMP/mertensia-channel-test/junit.xml"
      - name: Build installer and metadata from verified candidate
        env:
          RELEASE_IMAGE: ${{ steps.publish.outputs.image }}
          RELEASE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          sudo env "MERTENSIA_BUILD_MODE=production" "MERTENSIA_PAYLOAD_IMAGE=$RELEASE_IMAGE" "MERTENSIA_TARGET_IMAGE=ghcr.io/mertensiaos/mertensiaos:latest" bash scripts/iso-image.sh
          sudo python3 scripts/release-channel.py metadata "$RELEASE_DIGEST" output/installer/release.json
          sudo chown -R "$(id -u):$(id -g)" output/installer
          (cd output/installer && sha256sum mertensiaos-installer.iso release.json > SHA256SUMS)
      - name: Sign installer checksums
        run: |
          cosign sign-blob --yes --bundle output/installer/SHA256SUMS.sigstore.json output/installer/SHA256SUMS
          bash scripts/verify-release.sh --checksums output/installer/SHA256SUMS
      - name: Save installer and signed checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mertensiaos-${{ steps.version.outputs.version }}
          path: |
            output/installer/mertensiaos-installer.iso
            output/installer/release.json
            output/installer/SHA256SUMS
            output/installer/SHA256SUMS.sigstore.json
          compression-level: 0
          retention-days: 30
      - name: Promote passing candidate to testing
        env:
          RELEASE_DIGEST: ${{ steps.publish.outputs.digest }}
          REGISTRY_AUTH_FILE: /root/.docker/config.json
        run: sudo --preserve-env=REGISTRY_AUTH_FILE python3 scripts/release-channel.py testing "$RELEASE_DIGEST"
      - name: Collect test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-test-diagnostics
          path: |
            ${{ runner.temp }}/mertensia-release-test/result.json
            ${{ runner.temp }}/mertensia-release-test/junit.xml
            ${{ runner.temp }}/mertensia-release-test/*.log
            ${{ runner.temp }}/mertensia-channel-test/result.json
            ${{ runner.temp }}/mertensia-channel-test/junit.xml
            ${{ runner.temp }}/mertensia-channel-test/*.log
          if-no-files-found: warn
      - name: Remove registry credentials
        if: always()
        run: sudo rm -f /root/.docker/config.json
  promote:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.promote_digest
    runs-on: ubuntu-24.04
    environment: stable
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Require protected stable environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/stable" \
            | jq -e 'any(.protection_rules[]; .type == "required_reviewers" and (.reviewers | length > 0))'
      - name: Promote the approved testing digest
        env:
          CANDIDATE: ${{ inputs.promote_digest }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/promotion-auth.json
        run: |
          printf '%s' "$GHCR_TOKEN" | skopeo login ghcr.io --username "$GHCR_USER" --password-stdin
          python3 scripts/release-channel.py latest "$CANDIDATE"
      - name: Remove registry credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/promotion-auth.json"
