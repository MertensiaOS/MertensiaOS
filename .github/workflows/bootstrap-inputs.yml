name: Bootstrap retained build inputs
on:
  push:
    branches: [t3/lock-build-inputs]
    paths: [.github/workflows/bootstrap-inputs.yml]
permissions:
  contents: read
  packages: write
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: sudo apt-get update && sudo apt-get install -y podman skopeo
      - run: sudo python3 scripts/build-inputs.py refresh "$RUNNER_TEMP/build-rpms" "$RUNNER_TEMP/inputs.json"
      - name: Push immutable RPM bundle
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          auth="$RUNNER_TEMP/input-auth.json"
          printf '%s' "$GHCR_TOKEN" | sudo podman login --authfile "$auth" ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          sudo env "REGISTRY_AUTH_FILE=$auth" python3 scripts/build-inputs.py retain "$RUNNER_TEMP/build-rpms" "$RUNNER_TEMP/inputs.json"
          sudo rm -f "$auth"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bootstrap-build-input-lock
          path: build-inputs/lock.json
          if-no-files-found: error
