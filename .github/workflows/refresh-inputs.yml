name: Check upstream build inputs
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  packages: write
concurrency:
  group: refresh-build-inputs
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y podman skopeo python3-rpm
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
          install-dir: /usr/local/bin
          use-sudo: 'true'
      - name: Resolve verified published inventory and check upstream tools
        id: baseline
        run: |
          baseline=$(python3 scripts/release-channel.py baseline)
          printf '%s\n' "$baseline" >> "$GITHUB_OUTPUT"
          digest=$(sed -n 's/^digest=//p' <<< "$baseline")
          image="ghcr.io/mertensiaos/mertensiaos@$digest"
          sudo bash scripts/verify-release.sh "$image" containers-storage:localhost/mertensiaos:published-inventory
          sudo podman run --rm --network=none --entrypoint /usr/bin/rpm localhost/mertensiaos:published-inventory \
            -qa --qf $'%{NAME}\t%{EPOCHNUM}\t%{VERSION}\t%{RELEASE}\t%{ARCH}\t%{SOURCERPM}\n' \
            | awk -F '\t' '$1 != "gpg-pubkey"' | sort > "$RUNNER_TEMP/published-rpms"
          python3 scripts/build-inputs.py check-retention >/dev/null
          /usr/bin/python3 scripts/check-upstream.py tools
      - name: Resolve and verify complete proposed inputs
        run: sudo python3 scripts/build-inputs.py refresh "$RUNNER_TEMP/build-rpms" "$RUNNER_TEMP/inputs.json"
      - name: Compare locked and published inventories with stable advisories
        id: report
        env:
          BASELINE: ${{ steps.baseline.outputs.channel }}@${{ steps.baseline.outputs.digest }}
        run: |
          /usr/bin/python3 scripts/check-upstream.py report "$RUNNER_TEMP/inputs.json" "$RUNNER_TEMP/published-rpms" \
            "$BASELINE" "$RUNNER_TEMP/upstream-report.md" "$RUNNER_TEMP/refresh-pr.md" >> "$GITHUB_OUTPUT"
          printf '\n[Full upstream report](%s/%s/actions/runs/%s)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/refresh-pr.md"
          head -c 60000 "$RUNNER_TEMP/upstream-report.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-input-report
          path: ${{ runner.temp }}/upstream-report.md
          if-no-files-found: error
      - name: Retain immutable RPM bundle
        if: steps.report.outputs.changed == 'true'
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          auth="$RUNNER_TEMP/input-auth.json"
          trap 'sudo rm -f "$auth"' EXIT
          printf '%s' "$GHCR_TOKEN" | sudo podman login --authfile "$auth" ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          sudo env "REGISTRY_AUTH_FILE=$auth" python3 scripts/build-inputs.py retain "$RUNNER_TEMP/build-rpms" "$RUNNER_TEMP/inputs.json"
          sudo chown "$(id -u):$(id -g)" build-inputs/lock.json
      - name: Create dependency refresh installation token
        id: refresh-token
        if: steps.report.outputs.changed == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.DEPENDENCY_REFRESH_APP_ID }}
          private-key: ${{ secrets.DEPENDENCY_REFRESH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Open or update the signed dependency refresh PR
        id: proposal
        if: steps.report.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.refresh-token.outputs.token }}
          SECURITY: ${{ steps.report.outputs.security }}
        run: |
          bash scripts/propose-input-refresh.sh "$RUNNER_TEMP/refresh-pr.md" "$SECURITY"
      - name: Verify required pull request workflows were triggered
        if: steps.proposal.outputs.head != ''
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.proposal.outputs.head }}
        run: |
          for workflow in ci.yml iso-smoke.yml; do
            deadline=$((SECONDS + 120))
            while true; do
              status=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs" \
                -f event=pull_request -f branch=automation/refresh-build-inputs -f "head_sha=$HEAD_SHA" \
                --jq '.workflow_runs[0] | if . == null then "" else "\(.status)/\(.conclusion // "none")" end')
              case "$status" in
                requested/*|queued/*|pending/*|in_progress/*|completed/success) break ;;
                action_required/*|waiting/*|completed/action_required)
                  echo "::error::$workflow needs approval. Check the repository Actions policy for the dependency refresh app."
                  exit 1 ;;
              esac
              if (( SECONDS >= deadline )); then
                echo "::error::$workflow did not start normally for refresh head $HEAD_SHA ($status)"
                exit 1
              fi
              sleep 10
            done
          done
